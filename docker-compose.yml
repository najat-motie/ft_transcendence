
services:

  backend:
    build: ./backend
    container_name: ft_backend
    pull_policy: if_not_present
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      API_BASE_URL: ${API_BASE_URL:-https://localhost}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://localhost}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID:-}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET:-}
      OAUTH_42_CALLBACK_URL: ${OAUTH_42_CALLBACK_URL:-https://localhost/api/auth/42/callback}
      GAME_SERVICE_URL: https://game:8443
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    # ports:
    #   - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      game:
        condition: service_started
    restart: on-failure
    networks:
      - ft_transcendence

  game:
    build: ./game
    container_name: ft_game
    pull_policy: if_not_present
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    # ports:
    #   - "8000:8000"
    restart: on-failure
    networks:
      - ft_transcendence

  db:
    image: postgres:14
    container_name: ft_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    networks:
      - ft_transcendence
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: ft_frontend
    pull_policy: if_not_present
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost/api}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://localhost}
    # ports:
    #   - "5173:5173"
    networks:
      - ft_transcendence

  caddy:
    image: caddy:2
    container_name: ft_caddy
    pull_policy: if_not_present
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - ft_transcendence

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  ft_transcendence:
    driver: bridge
