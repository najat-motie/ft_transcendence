
services:

  backend:
    build: ./backend
    container_name: ft_backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - ft_transcendence

  db:
    image: postgres:14
    container_name: ft_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - ft_transcendence
    volumes:
      - db_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    container_name: ft_frontend
    ports:
      - "5173:5173"
    networks:
      - ft_transcendence

volumes:
  db_data:

networks:
  ft_transcendence:
    driver: bridge
