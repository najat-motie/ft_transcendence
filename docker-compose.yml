services:

  frontend:
    build: ./frontend
    image: frontend:1337
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - ft_transcendence

  backend:
    build: ./backend
    image: backend:1337
    container_name: backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - ft_transcendence

  game:
      build: ./game
      image: game:1337
      container_name: game
      ports:
        - "8000:8000"
      networks:
        - ft_transcendence

  db:
    image: postgres:14
    container_name: database
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - ft_transcendence
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
         
volumes:
  db_data:

networks:
  ft_transcendence:
    name: tic-tac-toe
    driver: bridge